<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skirk Web UI</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e6e6e6;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { max-width: 560px; padding: 32px; background: #1a1d24; border-radius: 12px;
           box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; }
    h1 { margin-top: 0; color: #7fb3ff; }
    code { background: #2a2d34; padding: 2px 6px; border-radius: 4px; }
    a { color: #7fb3ff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🌿 Skirk Web UI</h1>
    <p>The backend is online. The full dashboard ships in the next step.</p>
    <p>Try the API:</p>
    <p><code>GET /api/status</code></p>
    <p><a href="/api/status">/api/status</a></p>
  </div>
</body>
</html>
